    - OPENAI_API_KEY
    - OPENROUTER_API_KEY
    - DEEPSEEK_API_KEY
    - ZAI_API_KEY
    - ZHIPU_API_KEY
    - MINIMAX_API_KEY
    - XIAOO_CONFIG
  setup_commands: []
