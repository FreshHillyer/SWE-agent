agent:
  type: xiaoo_binary
  binary_path: /home/cz/xiaoO/target-musl-fresh/x86_64-unknown-linux-musl/release/xiaoo
  config_path: /root/.config/xiaoo/config.toml
  max_turns: 80
  timeout: 3600
  debug: false
  trace_db_path: ~/.xiaoo/traces.db
  trace_output_filename: xiaoo_traces.db
